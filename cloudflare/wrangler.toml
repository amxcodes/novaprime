name = "nova"
main = "worker.ts"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# NOVA's Supabase PostgreSQL project is in AWS Seoul (ap-northeast-2). Place
# API execution near the database; static assets remain served at the edge
# because only /api/* is routed through the Worker below.
[placement]
region = "aws:ap-northeast-2"

[build]
command = "bun run build:web"

[vars]
NOVA_BACKGROUND_SCHEDULER = "cloudflare"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "none"

# Replace with the Hyperdrive configuration id for the Supabase/PostgreSQL
# project. The connection string is supplied to the Worker at request time;
# it is never committed to this repository.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "replace-with-hyperdrive-config-id"
