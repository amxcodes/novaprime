x-postgres-base: &postgres-base
  image: postgres:17-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: nova
    POSTGRES_USER: nova_migrator
    POSTGRES_PASSWORD: ${NOVA_MIGRATOR_PASSWORD:?Set NOVA_MIGRATOR_PASSWORD in .env}
    NOVA_APP_PASSWORD: ${NOVA_APP_PASSWORD:?Set NOVA_APP_PASSWORD in .env}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U nova_migrator -d nova"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  postgres:
    <<: *postgres-base
    ports:
      - "127.0.0.1:${NOVA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - nova_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  postgres-qa:
    <<: *postgres-base
    profiles: ["qa"]
    restart: "no"
    volumes:
      - nova_qa_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      MIGRATOR_DATABASE_URL: "postgresql://nova_migrator:${NOVA_MIGRATOR_PASSWORD}@postgres:5432/nova"
      NOVA_APPLICATION_DATABASE_ROLE: nova_app
    depends_on:
      postgres:
        condition: service_healthy
    command: bun run --cwd server migrate

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://nova_app:${NOVA_APP_PASSWORD}@postgres:5432/nova"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      NOVA_ALLOWED_ORIGINS: ${NOVA_ALLOWED_ORIGINS:-}
      NOVA_TRUST_PROXY_HEADERS: ${NOVA_TRUST_PROXY_HEADERS:-true}
      NOVA_BOOTSTRAP_TOKEN: ${NOVA_BOOTSTRAP_TOKEN:?Set NOVA_BOOTSTRAP_TOKEN in .env}
      NOVA_SECRETS_ENCRYPTION_KEY: ${NOVA_SECRETS_ENCRYPTION_KEY:?Set NOVA_SECRETS_ENCRYPTION_KEY in .env}
      NOVA_BACKGROUND_JOB_SECRET: ${NOVA_BACKGROUND_JOB_SECRET:?Set NOVA_BACKGROUND_JOB_SECRET in .env}
      NOVA_BACKGROUND_SCHEDULER: ${NOVA_BACKGROUND_SCHEDULER:-vps}
      NOVA_RUNTIME_ADAPTER: ${NOVA_RUNTIME_ADAPTER:-vps}
      NOVA_RUNTIME_ID: ${NOVA_RUNTIME_ID:-docker-compose}
      NOVA_RELEASE_SHA: ${NOVA_RELEASE_SHA:-}
      NOVA_DB_POOL_MAX: ${NOVA_DB_POOL_MAX:-10}
      NOVA_AUTH_POOL_MAX: ${NOVA_AUTH_POOL_MAX:-5}
      NOVA_SERVE_WEB: "true"
      PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: node dist/index.js

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NOVA_API_BIND_ADDRESS:-127.0.0.1}:${NOVA_API_PORT:-3001}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  maintenance:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://nova_app:${NOVA_APP_PASSWORD}@postgres:5432/nova"
      NOVA_SECRETS_ENCRYPTION_KEY: ${NOVA_SECRETS_ENCRYPTION_KEY:?Set NOVA_SECRETS_ENCRYPTION_KEY in .env}
      NOVA_BACKGROUND_JOB_SECRET: ${NOVA_BACKGROUND_JOB_SECRET:?Set NOVA_BACKGROUND_JOB_SECRET in .env}
      NOVA_BACKGROUND_SCHEDULER: ${NOVA_BACKGROUND_SCHEDULER:-vps}
      NOVA_DB_POOL_MAX: ${NOVA_DB_POOL_MAX:-10}
      NOVA_MAINTENANCE_ENDPOINT: "http://api:3001/api/internal/background/tick"
      NOVA_MAINTENANCE_LOOP: "true"
      NOVA_MAINTENANCE_INTERVAL_SECONDS: ${NOVA_MAINTENANCE_INTERVAL_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
    command: node dist/maintenance-worker.js

  qa:
    profiles: ["qa"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      MIGRATOR_DATABASE_URL: "postgresql://nova_migrator:${NOVA_MIGRATOR_PASSWORD:?Set NOVA_MIGRATOR_PASSWORD in .env}@postgres-qa:5432/postgres"
      NOVA_APP_PASSWORD: ${NOVA_APP_PASSWORD:?Set NOVA_APP_PASSWORD in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      NOVA_BOOTSTRAP_TOKEN: ${NOVA_BOOTSTRAP_TOKEN:?Set NOVA_BOOTSTRAP_TOKEN in .env}
      NOVA_SECRETS_ENCRYPTION_KEY: ${NOVA_SECRETS_ENCRYPTION_KEY:?Set NOVA_SECRETS_ENCRYPTION_KEY in .env}
      NOVA_BACKGROUND_JOB_SECRET: ${NOVA_BACKGROUND_JOB_SECRET:?Set NOVA_BACKGROUND_JOB_SECRET in .env}
      NOVA_BACKGROUND_SCHEDULER: ${NOVA_BACKGROUND_SCHEDULER:-vps}
      NOVA_APPLICATION_DATABASE_ROLE: nova_app
      NOVA_DB_POOL_MAX: ${NOVA_QA_DB_POOL_MAX:-${NOVA_DB_POOL_MAX:-10}}
      NOVA_AUTH_POOL_MAX: ${NOVA_QA_AUTH_POOL_MAX:-${NOVA_AUTH_POOL_MAX:-5}}
      NOVA_QA_LOAD_EMPLOYEES: ${NOVA_QA_LOAD_EMPLOYEES:-0}
      NOVA_QA_REQUEST_SCOPED: ${NOVA_QA_REQUEST_SCOPED:-false}
    volumes:
      - ../scripts:/app/scripts:ro
    depends_on:
      postgres-qa:
        condition: service_healthy
    command: bun scripts/local-postgres-qa.ts

volumes:
  nova_postgres_data:
  nova_qa_postgres_data:
