name: Verify NOVA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Smoke Netlify production function packaging
        shell: bash
        env:
          NETLIFY_SITE_ID: "00000000-0000-0000-0000-000000000001"
        run: |
          set -euo pipefail
          supabase_log="$(mktemp)"
          netlify_log="$(mktemp)"
          trap 'rm -f "$supabase_log" "$netlify_log"' EXIT

          if ! NOVA_BACKGROUND_SCHEDULER=supabase npx --yes netlify-cli@27.12.0 build --offline --context production >"$supabase_log" 2>&1; then
            tail -n 80 "$supabase_log"
            exit 1
          fi
          grep -E "Packaging Functions from.*without-native-cron" "$supabase_log"
          grep -q "nova.mts" "$supabase_log"
          if grep -q "nova-background-tick.mts" "$supabase_log"; then
            echo "Supabase Cron profile must not package a Netlify scheduled function"
            exit 1
          fi

          if ! NOVA_BACKGROUND_SCHEDULER=netlify npx --yes netlify-cli@27.12.0 build --offline --context production >"$netlify_log" 2>&1; then
            tail -n 80 "$netlify_log"
            exit 1
          fi
          grep -E "Packaging Functions from.*with-netlify-cron" "$netlify_log"
          grep -q "nova.mts" "$netlify_log"
          grep -q "nova-background-tick.mts" "$netlify_log"
          echo "Netlify production function packaging smoke passed."
      - run: bun run test
      - run: bun run test:updater
      - run: bun run test:deployment-manager
      - run: bun run typecheck
      - run: bun run typecheck:operator
      - run: bun run update:manifest --check
      - run: bun run typecheck:cloudflare
      - run: bun test cloudflare/worker.test.ts
      - name: Build Cloudflare + Supabase profile without uploading
        run: npx --yes wrangler@4.141.0 deploy --dry-run --config cloudflare/wrangler.supabase-cron.toml
      - name: Smoke Cloudflare Worker Gmail delivery in workerd
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 --version
          worker_log="$(mktemp)"
          response=""
          npx --yes wrangler@4.141.0 dev --local \
            --config cloudflare/wrangler.email-smoke.toml \
            --ip 127.0.0.1 --port 8799 >"$worker_log" 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
            cat "$worker_log"
            rm -f "$worker_log"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            response="$(curl -fsS http://127.0.0.1:8799/ 2>/dev/null)" && break || true
            sleep 0.5
          done
          if [[ -z "$response" ]]; then
            echo "Cloudflare Worker did not become ready"
            tail -n 80 "$worker_log"
            exit 1
          fi
          printf '%s' "$response" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              const checks = Object.values(result.checks || {});
              if (result.ok !== true || checks.length !== 5 || checks.some((check) => check !== true)) {
                throw new Error("CLOUDFLARE_EMAIL_RUNTIME_SMOKE_FAILED");
              }
              console.log("Cloudflare Worker Gmail HTTPS/MIME runtime smoke passed.");
            });
          '
      - run: bun run --cwd server build
      - run: node --check web/app.js
      - name: Typecheck the PostgreSQL smoke harness
        run: >-
          node server/node_modules/typescript/bin/tsc --noEmit --strict
          --target ESNext --module Preserve --moduleResolution Bundler
          --skipLibCheck --allowImportingTsExtensions --types bun,node
          --typeRoots server/node_modules/@types
          scripts/runtime-lifecycle-smoke.ts scripts/runtime-specialized-smoke.ts

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: nova-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run clean PostgreSQL and authenticated lifecycle gate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ci_migrator_password="$(openssl rand -hex 32)"
          ci_app_password="$(openssl rand -hex 32)"
          ci_auth_secret="$(openssl rand -hex 32)"
          ci_bootstrap_token="$(openssl rand -hex 32)"
          ci_encryption_key="$(openssl rand -base64 32 | tr '/+' '_-' | tr -d '=')"
          ci_background_secret="$(openssl rand -hex 32)"
          {
            printf 'NOVA_MIGRATOR_PASSWORD=%s\n' "$ci_migrator_password"
            printf 'NOVA_APP_PASSWORD=%s\n' "$ci_app_password"
            printf 'BETTER_AUTH_SECRET=%s\n' "$ci_auth_secret"
            printf 'BETTER_AUTH_URL=http://localhost:3001\n'
            printf 'NOVA_BOOTSTRAP_TOKEN=%s\n' "$ci_bootstrap_token"
            printf 'NOVA_SECRETS_ENCRYPTION_KEY=%s\n' "$ci_encryption_key"
            printf 'NOVA_BACKGROUND_JOB_SECRET=%s\n' "$ci_background_secret"
            printf 'NOVA_BACKGROUND_SCHEDULER=vps\n'
            printf 'NOVA_MAINTENANCE_INTERVAL_SECONDS=10\n'
          } > .env
          profile_started=0
          cleanup() {
            result=$?
            if [[ "$profile_started" == "1" ]]; then
              if [[ "$result" != "0" ]]; then
                docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env logs --no-color || true
              fi
              docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env down --volumes --remove-orphans || true
            fi
            rm -f .env
            return "$result"
          }
          trap cleanup EXIT
          bun run qa:postgres
          NOVA_QA_REQUEST_SCOPED=true bun run qa:postgres
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env config --quiet
          profile_started=1
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env up --build --detach
          health=""
          readiness=""
          for attempt in $(seq 1 120); do
            health="$(curl -fsS http://127.0.0.1:3001/api/health 2>/dev/null || true)"
            readiness="$(curl -fsS http://127.0.0.1:3001/api/ready 2>/dev/null || true)"
            if [[ -n "$health" && -n "$readiness" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$health" || -z "$readiness" ]]; then
            echo "Self-hosted Compose profile did not become healthy and ready through Nginx"
            exit 1
          fi
          printf '%s' "$readiness" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.service !== "nova-api" || result.status !== "ready" || result.scheduler !== "vps") {
                throw new Error("SELF_HOSTED_COMPOSE_READINESS_FAILED");
              }
              console.log("Self-hosted Compose API readiness and scheduler selection passed.");
            });
          '
          direct_api_port="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env port api 3001 2>/dev/null || true)"
          if [[ -n "$direct_api_port" ]]; then
            echo "Self-hosted API port must remain private behind Nginx"
            exit 1
          fi
          tick_seen=0
          for attempt in $(seq 1 45); do
            tick_logs="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env logs --no-color maintenance 2>&1 || true)"
            if printf '%s' "$tick_logs" | grep -q '\[NOVA background\] closed '; then
              tick_seen=1
              break
            fi
            sleep 2
          done
          if [[ "$tick_seen" != "1" ]]; then
            echo "Self-hosted Compose maintenance worker did not complete a tick"
            exit 1
          fi
          tick_count=0
          for attempt in $(seq 1 15); do
            tick_count="$(printf '%s' "$tick_logs" | grep -c '\[NOVA background\] closed ' || true)"
            if [[ "$tick_count" -ge 2 ]]; then break; fi
            sleep 2
            tick_logs="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env logs --no-color maintenance 2>&1 || true)"
          done
          if [[ "$tick_count" -lt 2 ]]; then
            echo "Self-hosted Compose maintenance worker did not complete two scheduled ticks"
            exit 1
          fi
          maintenance_id="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/compose.yaml --env-file .env ps --quiet maintenance)"
          maintenance_state="$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' "$maintenance_id")"
          if [[ "$maintenance_state" != "running 0" ]]; then
            echo "Self-hosted maintenance worker did not remain stable: $maintenance_state"
            exit 1
          fi
          echo "Self-hosted Docker, PostgreSQL, Nginx, and maintenance profile smoke passed."
