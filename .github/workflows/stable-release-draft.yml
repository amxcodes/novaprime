name: Prepare NOVA stable release draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  draft-release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Validate the immutable release candidate
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "STABLE_RELEASE_TAG_INVALID"
            exit 1
          fi
          version="${tag#v}"
          package_version="$(node -p 'require("./package.json").version')"
          manifest_version="$(node -p 'require("./release-manifest.json").version')"
          if [[ "$package_version" != "$version" || "$manifest_version" != "$version" ]]; then
            echo "STABLE_RELEASE_VERSION_MISMATCH"
            exit 1
          fi
          if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "STABLE_RELEASE_TAG_COMMIT_MISMATCH"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "STABLE_RELEASE_COMMIT_NOT_ON_MAIN"
            exit 1
          fi
          remote_tag_refs="$(git ls-remote origin "refs/tags/$tag")"
          remote_tag_commit="$(printf '%s\n' "$remote_tag_refs" | awk -v ref="refs/tags/$tag" '$2 == ref { tag_commit = $1 } $2 == ref "^{}" { peeled_commit = $1 } END { print peeled_commit != "" ? peeled_commit : tag_commit }')"
          if [[ "$remote_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "STABLE_RELEASE_REMOTE_TAG_CHANGED"
            exit 1
          fi
          bun run update:manifest --check
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("release-manifest.json", "utf8"));
            const notes = [
              `NOVA ${process.env.RELEASE_TAG}`,
              "",
              `Migration class: ${manifest.migrationClass}`,
              `Impact: ${manifest.impact}`,
              `Canonical migrations in this source release: ${manifest.migrations.length}`,
              manifest.minimumStartingVersion
                ? `Minimum supported starting version: ${manifest.minimumStartingVersion}`
                : "Starting-version compatibility must be reviewed in the release notes.",
              "",
              `Verified source commit: ${process.env.GITHUB_SHA}`,
              "",
              "This draft was generated only after the tagged commit passed the full NOVA verification workflow. Review the impact and compatibility notes before publishing.",
            ].join("\n");
            writeFileSync(`${process.env.RUNNER_TEMP}/nova-release-notes.md`, `${notes}\n`, { flag: "wx" });
          '
      - name: Create a draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --title "NOVA $RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/nova-release-notes.md"
